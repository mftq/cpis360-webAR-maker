<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CPIS360 - WebAR Lab</title>

    <!-- using older stable versions of aframe and ar.js that are known to work well on mobile -->
    <script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/jeromeetienne/AR.js/2.0.8/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">

    <!--
      a-scene handles the whole AR experience
      embedded fits it inside the browser window
      arjs connects to the webcam and detects the hiro marker
    -->
    <a-scene embedded arjs>

      <!-- hiro is the standard AR.js marker -->
      <a-marker preset="hiro">

        <!--
          Shape 1 - Red box in the center
          rotates continuously so animation requirement is clearly met
        -->
        <a-box
          position="0 0.5 0"
          rotation="0 45 0"
          scale="0.75 0.75 0.75"
          color="#e63946"
        >
          <!-- spin the box around Y axis forever -->
          <a-animation
            attribute="rotation"
            to="0 360 0"
            dur="2000"
            easing="linear"
            repeat="indefinite"
          ></a-animation>
        </a-box>

        <!--
          Shape 2 - Blue sphere on the left
          bounces up and down so animation is very visible
        -->
        <a-sphere
          position="-1 0.5 0"
          radius="0.35"
          color="#457b9d"
        >
          <!-- bounce from bottom to top repeatedly -->
          <a-animation
            attribute="position"
            from="-1 0.2 0"
            to="-1 0.9 0"
            dur="800"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-sphere>

        <!--
          Shape 3 - Green cylinder on the right
          pulses in scale like its breathing
        -->
        <a-cylinder
          position="1 0.5 0"
          radius="0.25"
          height="0.75"
          color="#2a9d8f"
        >
          <!-- grow and shrink repeatedly -->
          <a-animation
            attribute="scale"
            from="1 1 1"
            to="1 1.8 1"
            dur="900"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-cylinder>

        <!--
          Shape 4 - Yellow cone behind the box
          static shape just for variety
        -->
        <a-cone
          position="0 0.4 -1"
          radius-bottom="0.4"
          height="0.7"
          color="#e9c46a"
        ></a-cone>

        <!--
          Student name floating above all the shapes
          white so it contrasts well with the camera feed
        -->
        <a-text
          value="Murhaf Baik - CPIS360"
          align="center"
          position="0 1.5 0"
          scale="1.5 1.5 1.5"
          color="#ffffff"
        ></a-text>

      </a-marker>

      <!-- default camera required for AR.js -->
      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
