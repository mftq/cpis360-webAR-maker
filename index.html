<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPIS360 - WebAR Lab</title>

    <!-- A-Frame library for building 3D and AR scenes -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- AR.js adds marker-based AR support on top of A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      html, body {
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>

    <!--
      Main AR scene
      - embedded: renders inside the page not fullscreen
      - arjs: enables AR with webcam
      - vr-mode-ui disabled: hides the VR headset button
      - logarithmicDepthBuffer: fixes z-fighting between overlapping shapes
    -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >

      <!-- Hiro is the default AR.js marker, print it or display on screen -->
      <a-marker preset="hiro">

        <!--
          Shape 1 - Red box in the center
          small scale so it fits nicely above the marker without filling the screen
          rotates continuously so the animation requirement is clearly met
        -->
        <a-box
          position="0 0.15 0"
          rotation="0 45 0"
          scale="0.2 0.2 0.2"
          color="#e63946"
        >
          <!-- spin the box around the Y axis forever -->
          <a-animation
            attribute="rotation"
            from="0 0 0"
            to="0 360 0"
            dur="2000"
            easing="linear"
            repeat="indefinite"
          ></a-animation>
        </a-box>

        <!--
          Shape 2 - Blue sphere on the left of the box
          bounces up and down so its easy to notice the animation
        -->
        <a-sphere
          position="-0.3 0.1 0"
          radius="0.1"
          color="#457b9d"
        >
          <!-- bounce up and down repeatedly -->
          <a-animation
            attribute="position"
            from="-0.3 0.05 0"
            to="-0.3 0.25 0"
            dur="800"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-sphere>

        <!--
          Shape 3 - Green cylinder on the right of the box
          pulses in scale up and down like its breathing
        -->
        <a-cylinder
          position="0.3 0.15 0"
          radius="0.07"
          height="0.25"
          color="#2a9d8f"
        >
          <!-- grow then shrink repeatedly -->
          <a-animation
            attribute="scale"
            from="1 1 1"
            to="1 1.8 1"
            dur="900"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-cylinder>

        <!--
          Shape 4 - Yellow cone sitting behind the box
          adds variety to the scene without overlapping the other shapes
        -->
        <a-cone
          position="0 0.1 -0.3"
          radius-bottom="0.1"
          height="0.2"
          color="#e9c46a"
        ></a-cone>

        <!--
          Student name floating above all the shapes
          white color so it stands out against the camera background
        -->
        <a-text
          value="Murhaf Baik - CPIS360"
          align="center"
          position="0 0.45 0"
          scale="0.35 0.35 0.35"
          color="#ffffff"
        ></a-text>

      </a-marker>

      <!-- Camera entity needed for AR.js to access the device camera -->
      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
