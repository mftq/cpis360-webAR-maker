<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebAR Lab - CPIS360</title>

    <!-- these two libraries are needed to make AR work in the browser -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <!-- custom spin component - registered after aframe loads so no errors -->
    <script>
      AFRAME.registerComponent('spin', {
        tick: function (time, delta) {
          var rot = this.el.getAttribute('rotation');
          rot.y += delta * 0.1;
          this.el.setAttribute('rotation', rot);
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">

    <!-- main AR scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

      <!-- hiro marker -->
      <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

        <!-- red box in the middle that spins -->
        <a-box position="0 0.3 0" scale="0.4 0.4 0.4" color="#e63946" spin></a-box>

        <!-- blue sphere on the left -->
        <a-sphere position="-0.6 0.2 0" radius="0.2" color="#457b9d"></a-sphere>

        <!-- green cylinder on the right -->
        <a-cylinder position="0.6 0.25 0" radius="0.15" height="0.5" color="#2a9d8f"></a-cylinder>

        <!-- yellow cone in the front -->
        <a-cone position="0 0.2 0.6" radius-bottom="0.2" height="0.4" color="#e9c46a"></a-cone>

        <!-- my name above everything -->
        <a-text value="Murhaf Baik - CPIS360" align="center" position="0 1.0 0" scale="0.7 0.7 0.7" color="#ffffff"></a-text>

      </a-marker>

      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
