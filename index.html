<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>CPIS360 - WebAR Lab</title>

    <!-- A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
    </style>

    <script>
      // force the video to fill the full screen after AR.js creates it
      // this fixes the zoomed in camera issue on Chrome mobile
      window.addEventListener('load', function () {
        var checkVideo = setInterval(function () {
          var video = document.querySelector('video');
          if (video) {
            video.style.width = '100vw';
            video.style.height = '100vh';
            video.style.objectFit = 'cover';
            video.style.position = 'fixed';
            video.style.top = '0';
            video.style.left = '0';
            video.style.zIndex = '-1';
            clearInterval(checkVideo);
          }
        }, 100);
      });
    </script>
  </head>

  <body>

    <!--
      Main AR scene
      embedded = fits in the browser window
      arjs = webcam access and hiro marker detection
      vr-mode-ui disabled = no VR button needed
    -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >

      <!-- Hiro marker - point camera at printed hiro marker -->
      <a-marker preset="hiro">

        <!--
          Shape 1 - Red box in the center
          spins continuously around Y axis
        -->
        <a-box
          position="0 0.3 0"
          rotation="0 45 0"
          scale="0.4 0.4 0.4"
          color="#e63946"
        >
          <a-animation
            attribute="rotation"
            from="0 0 0"
            to="0 360 0"
            dur="3000"
            easing="linear"
            repeat="indefinite"
          ></a-animation>
        </a-box>

        <!--
          Shape 2 - Blue sphere on the left
          bounces up and down
        -->
        <a-sphere
          position="-0.6 0.2 0"
          radius="0.2"
          color="#457b9d"
        >
          <a-animation
            attribute="position"
            from="-0.6 0.2 0"
            to="-0.6 0.5 0"
            dur="800"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-sphere>

        <!--
          Shape 3 - Green cylinder on the right
          grows and shrinks in scale
        -->
        <a-cylinder
          position="0.6 0.25 0"
          radius="0.15"
          height="0.5"
          color="#2a9d8f"
        >
          <a-animation
            attribute="scale"
            from="1 1 1"
            to="1 1.8 1"
            dur="900"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-cylinder>

        <!--
          Shape 4 - Yellow cone in front
          static shape for variety
        -->
        <a-cone
          position="0 0.2 0.6"
          radius-bottom="0.2"
          height="0.4"
          color="#e9c46a"
        ></a-cone>

        <!--
          Student name floating above all shapes
          white so it stands out clearly
        -->
        <a-text
          value="Murhaf Baik - CPIS360"
          align="center"
          position="0 1.0 0"
          scale="0.7 0.7 0.7"
          color="#ffffff"
        ></a-text>

      </a-marker>

      <!-- camera entity required for AR.js -->
      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
