<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPIS360 - WebAR Lab</title>

    <!-- A-Frame library for building 3D and AR scenes -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- AR.js adds marker-based AR support on top of A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">

    <!--
      Main AR scene
      - embedded: renders inside the page
      - arjs: enables AR with webcam
      - vr-mode-ui disabled: hides the VR button
    -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >

      <!-- Hiro marker - point camera at printed hiro marker -->
      <a-marker preset="hiro">

        <!--
          Shape 1 - Red rotating box in the center
          small scale so it fits nicely on the marker
        -->
        <a-box
          position="0 0.15 0"
          rotation="0 45 0"
          scale="0.2 0.2 0.2"
          color="#e63946"
        >
          <!-- spin the box around Y axis continuously -->
          <a-animation
            attribute="rotation"
            from="0 0 0"
            to="0 360 0"
            dur="2000"
            easing="linear"
            repeat="indefinite"
          ></a-animation>
        </a-box>

        <!--
          Shape 2 - Blue sphere on the left
          bounces up and down so the animation is obvious
        -->
        <a-sphere
          position="-0.3 0.1 0"
          radius="0.1"
          color="#457b9d"
        >
          <!-- bounce up and down repeatedly -->
          <a-animation
            attribute="position"
            from="-0.3 0.05 0"
            to="-0.3 0.25 0"
            dur="800"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-sphere>

        <!--
          Shape 3 - Green cylinder on the right
          pulses in scale so it looks like its breathing
        -->
        <a-cylinder
          position="0.3 0.15 0"
          radius="0.07"
          height="0.25"
          color="#2a9d8f"
        >
          <!-- grow tall then shrink back down -->
          <a-animation
            attribute="scale"
            from="1 1 1"
            to="1 1.8 1"
            dur="900"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-cylinder>

        <!--
          Shape 4 - Yellow cone behind the box
          static shape just to add variety to the scene
        -->
        <a-cone
          position="0 0.1 -0.3"
          radius-bottom="0.1"
          height="0.2"
          color="#e9c46a"
        ></a-cone>

        <!--
          Student name above all shapes
          white so it stands out against any background
        -->
        <a-text
          value="Murhaf Baik - CPIS360"
          align="center"
          position="0 0.45 0"
          scale="0.35 0.35 0.35"
          color="#ffffff"
        ></a-text>

      </a-marker>

      <!-- camera entity needed for AR.js to access device camera -->
      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
