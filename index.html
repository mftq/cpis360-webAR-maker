<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPIS360 - WebAR Lab</title>

    <!-- A-Frame library for building 3D and AR scenes -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- AR.js adds marker-based AR support on top of A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      /* make the canvas fill the whole screen */
      html, body {
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }

      /* force the video feed to fill the screen without zooming in */
      .a-canvas, video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover;
      }
    </style>
  </head>

  <body>

    <!--
      Main AR scene
      - embedded: renders inside the page not fullscreen
      - arjs: enables AR with webcam
      - debugUIEnabled false: hides the debug overlay
      - vr-mode-ui disabled: hides the VR headset button
      - logarithmicDepthBuffer: fixes z-fighting between overlapping shapes
    -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >

      <!-- Hiro is the default AR.js marker, print it or display on screen -->
      <a-marker preset="hiro">

        <!--
          Shape 1 - Red box in the center
          rotates 360 degrees continuously so the animation is very obvious
        -->
        <a-box
          position="0 0.6 0"
          rotation="0 45 0"
          scale="0.6 0.6 0.6"
          color="#e63946"
        >
          <!-- spin the box around the Y axis forever -->
          <a-animation
            attribute="rotation"
            from="0 0 0"
            to="0 360 0"
            dur="2000"
            easing="linear"
            repeat="indefinite"
          ></a-animation>
        </a-box>

        <!--
          Shape 2 - Blue sphere on the left
          bounces up and down with a large range so its easy to see
        -->
        <a-sphere
          position="-1 0.5 0"
          radius="0.35"
          color="#457b9d"
        >
          <!-- bounce from low to high and back repeatedly -->
          <a-animation
            attribute="position"
            from="-1 0.2 0"
            to="-1 1.0 0"
            dur="800"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-sphere>

        <!--
          Shape 3 - Green cylinder on the right
          pulses in scale so it looks like its breathing
        -->
        <a-cylinder
          position="1 0.5 0"
          radius="0.25"
          height="0.9"
          color="#2a9d8f"
        >
          <!-- grow tall then shrink back down repeatedly -->
          <a-animation
            attribute="scale"
            from="1 1 1"
            to="1 1.6 1"
            dur="900"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-cylinder>

        <!--
          Shape 4 - Yellow cone behind the box
          static shape just to add variety and depth to the scene
        -->
        <a-cone
          position="0 0.4 -1"
          radius-bottom="0.35"
          height="0.7"
          color="#e9c46a"
        ></a-cone>

        <!--
          Student name floating above all the shapes
          white color so it stands out against the camera background
        -->
        <a-text
          value="Murhaf Baik - CPIS360"
          align="center"
          position="0 1.6 0"
          scale="1 1 1"
          color="#ffffff"
        ></a-text>

      </a-marker>

      <!--
        Camera with a wider FOV to fix the zoomed in issue on mobile
        80 degrees is a natural wide angle that matches most phone cameras
      -->
      <a-entity camera fov="80"></a-entity>

    </a-scene>

  </body>
</html>
