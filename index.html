<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CPIS360 WebAR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- AR.js (STABLE VERSION) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
      detectionMode: mono;
    "
  >

    <!-- MARKER WITH SMOOTHING -->
    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- BOX -->
      <a-box
        position="0 0.5 0"
        rotation="0 45 0"
        scale="0.5 0.5 0.5"
        color="#e63946"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"
      ></a-box>

      <!-- SPHERE -->
      <a-sphere
        position="-0.8 0.4 0"
        radius="0.3"
        color="#457b9d"
        animation="property: position; dir: alternate; dur: 1000; loop: true; to: -0.8 0.8 0"
      ></a-sphere>

      <!-- CYLINDER -->
      <a-cylinder
        position="0.8 0.5 0"
        radius="0.2"
        height="0.8"
        color="#2a9d8f"
      ></a-cylinder>

      <!-- CONE -->
      <a-cone
        position="0 0.4 -0.8"
        radius-bottom="0.3"
        height="0.6"
        color="#e9c46a"
      ></a-cone>

      <!-- TEXT -->
      <a-text
        value="Murhaf Baik - CPIS360"
        align="center"
        position="0 1.3 0"
        scale="0.8 0.8 0.8"
        color="#ffffff"
      ></a-text>

    </a-marker>

    <!-- CAMERA (FIXED) -->
    <a-entity camera look-controls="enabled: false"></a-entity>

  </a-scene>

</body>
</html>
