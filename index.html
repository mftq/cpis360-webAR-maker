<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>CPIS360 - WebAR Lab</title>

    <!-- load A-Frame and AR.js first before anything else -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- register components AFTER aframe loads so AFRAME is defined -->
    <script>
      // spin the box around Y axis every frame
      AFRAME.registerComponent('spin', {
        tick: function (time, delta) {
          var rot = this.el.getAttribute('rotation');
          rot.y += delta * 0.1;
          this.el.setAttribute('rotation', rot);
        }
      });

      // bounce the sphere up and down using a sine wave
      AFRAME.registerComponent('bounce', {
        schema: { base: { type: 'number', default: 0.2 } },
        tick: function (time) {
          var pos = this.el.getAttribute('position');
          pos.y = this.data.base + Math.abs(Math.sin(time / 500)) * 0.3;
          this.el.setAttribute('position', pos);
        }
      });

      // pulse the cylinder scale up and down using a sine wave
      AFRAME.registerComponent('pulse', {
        tick: function (time) {
          var s = 1 + Math.abs(Math.sin(time / 600)) * 0.8;
          this.el.setAttribute('scale', '1 ' + s + ' 1');
        }
      });
    </script>

    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
    </style>

    <script>
      // fix video fill on mobile after AR.js creates the video element
      window.addEventListener('load', function () {
        var checkVideo = setInterval(function () {
          var video = document.querySelector('video');
          if (video) {
            video.style.width = '100vw';
            video.style.height = '100vh';
            video.style.objectFit = 'cover';
            video.style.position = 'fixed';
            video.style.top = '0';
            video.style.left = '0';
            video.style.zIndex = '-1';
            clearInterval(checkVideo);
          }
        }, 100);
      });
    </script>
  </head>

  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >
      <a-marker preset="hiro">

        <!-- red box with spin component -->
        <a-box
          position="0 0.3 0"
          scale="0.4 0.4 0.4"
          color="#e63946"
          spin
        ></a-box>

        <!-- blue sphere with bounce component -->
        <a-sphere
          position="-0.6 0.2 0"
          radius="0.2"
          color="#457b9d"
          bounce="base: 0.2"
        ></a-sphere>

        <!-- green cylinder with pulse component -->
        <a-cylinder
          position="0.6 0.25 0"
          radius="0.15"
          height="0.5"
          color="#2a9d8f"
          pulse
        ></a-cylinder>

        <!-- yellow cone static -->
        <a-cone
          position="0 0.2 0.6"
          radius-bottom="0.2"
          height="0.4"
          color="#e9c46a"
        ></a-cone>

        <!-- student name -->
        <a-text
          value="Murhaf Baik - CPIS360"
          align="center"
          position="0 1.0 0"
          scale="0.7 0.7 0.7"
          color="#ffffff"
        ></a-text>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
