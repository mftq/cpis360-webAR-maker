<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPIS360 - WebAR Lab</title>

    <!-- A-Frame library for 3D/AR scene building -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- AR.js for marker-based AR support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">

    <!--
      a-scene is the main AR scene
      embedded = fits inside the page instead of fullscreen
      arjs = enables AR.js with the Hiro marker
      vr-mode-ui disabled = we don't need the VR button
    -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >

      <!-- Load the default Hiro marker - print or display this on screen -->
      <a-marker preset="hiro">

        <!-- 
          Shape 1: Box (cube) in the center
          positioned slightly above the marker so it doesn't clip
        -->
        <a-box
          position="0 0.5 0"
          rotation="0 45 0"
          scale="0.5 0.5 0.5"
          color="#e63946"
        >
          <!-- Animation: rotate the box continuously around Y axis -->
          <a-animation
            attribute="rotation"
            to="0 360 0"
            dur="3000"
            easing="linear"
            repeat="indefinite"
          ></a-animation>
        </a-box>

        <!--
          Shape 2: Sphere floating to the left of the box
          a bit smaller and a different color
        -->
        <a-sphere
          position="-0.8 0.4 0"
          radius="0.3"
          color="#457b9d"
        >
          <!-- Animation: bounce the sphere up and down -->
          <a-animation
            attribute="position"
            from="-0.8 0.4 0"
            to="-0.8 0.8 0"
            dur="1000"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-sphere>

        <!--
          Shape 3: Cylinder to the right side
          taller and thinner to look different from the box
        -->
        <a-cylinder
          position="0.8 0.5 0"
          radius="0.2"
          height="0.8"
          color="#2a9d8f"
        ></a-cylinder>

        <!--
          Shape 4 (bonus): Cone sitting behind the box
          adds depth to the scene
        -->
        <a-cone
          position="0 0.4 -0.8"
          radius-bottom="0.3"
          height="0.6"
          color="#e9c46a"
        ></a-cone>

        <!--
          Student name displayed above all shapes
          align center so it sits nicely above the marker
          value = replace this with your actual name
        -->
        <a-text
          value="Murhaf Baik - CPIS360"
          align="center"
          position="0 1.3 0"
          scale="0.8 0.8 0.8"
          color="#ffffff"
        ></a-text>

      </a-marker>

      <!-- Camera is required for AR.js to access the webcam -->
      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
