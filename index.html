<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPIS360 - WebAR Lab</title>

    <!-- A-Frame library for building 3D and AR scenes -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- AR.js adds marker-based AR support on top of A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">

    <!--
      Main AR scene
      - embedded: renders inside the page not fullscreen
      - arjs: enables AR with webcam, zoom set to 1 to fix zoomed in camera issue
      - vr-mode-ui disabled: hides the VR headset button we dont need it
      - logarithmicDepthBuffer: fixes z-fighting issues with overlapping shapes
    -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; zoom: 1;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >

      <!-- Hiro is the default AR.js marker, print it or show it on screen -->
      <a-marker preset="hiro">

        <!--
          Shape 1 - Red box in the center
          spins 360 degrees continuously so the animation is obvious
          scaled up a bit so its easy to see
        -->
        <a-box
          position="0 0.6 0"
          rotation="0 45 0"
          scale="0.6 0.6 0.6"
          color="#e63946"
        >
          <!-- rotate the box forever around the Y axis -->
          <a-animation
            attribute="rotation"
            from="0 0 0"
            to="0 360 0"
            dur="2000"
            easing="linear"
            repeat="indefinite"
          ></a-animation>
        </a-box>

        <!--
          Shape 2 - Blue sphere on the left
          bounces up and down with a big range so its very visible
        -->
        <a-sphere
          position="-1 0.5 0"
          radius="0.35"
          color="#457b9d"
        >
          <!-- bounce from low to high repeatedly -->
          <a-animation
            attribute="position"
            from="-1 0.2 0"
            to="-1 1.0 0"
            dur="800"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-sphere>

        <!--
          Shape 3 - Green cylinder on the right
          grows and shrinks in scale so the animation is easy to notice
        -->
        <a-cylinder
          position="1 0.5 0"
          radius="0.25"
          height="0.9"
          color="#2a9d8f"
        >
          <!-- pulse the cylinder scale up and down -->
          <a-animation
            attribute="scale"
            from="1 1 1"
            to="1 1.6 1"
            dur="900"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-cylinder>

        <!--
          Shape 4 - Yellow cone behind the box
          adds more depth and variety to the scene
        -->
        <a-cone
          position="0 0.4 -1"
          radius-bottom="0.35"
          height="0.7"
          color="#e9c46a"
        ></a-cone>

        <!--
          Student name shown above everything
          white so it contrasts well with the camera feed background
        -->
        <a-text
          value="Murhaf Baik - CPIS360"
          align="center"
          position="0 1.6 0"
          scale="1 1 1"
          color="#ffffff"
        ></a-text>

      </a-marker>

      <!-- Camera entity required for AR.js to access the device camera -->
      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
