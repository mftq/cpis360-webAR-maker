<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>CPIS360 - WebAR Lab</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
    </style>

    <script>
      window.addEventListener('load', function () {
        var checkVideo = setInterval(function () {
          var video = document.querySelector('video');
          if (video) {
            video.style.width = '100vw';
            video.style.height = '100vh';
            video.style.objectFit = 'cover';
            video.style.position = 'fixed';
            video.style.top = '0';
            video.style.left = '0';
            video.style.zIndex = '-1';
            clearInterval(checkVideo);
          }
        }, 100);
      });
    </script>
  </head>

  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >
      <a-marker preset="hiro">

        <!-- spinning red box -->
        <a-box
          position="0 0.3 0"
          scale="0.4 0.4 0.4"
          color="#e63946"
          animation="property: rotation; from: 0 0 0; to: 0 360 0; loop: true; dur: 2000; easing: linear"
        ></a-box>

        <a-sphere position="-0.6 0.2 0" radius="0.2" color="#457b9d"></a-sphere>
        <a-cylinder position="0.6 0.25 0" radius="0.15" height="0.5" color="#2a9d8f"></a-cylinder>
        <a-cone position="0 0.2 0.6" radius-bottom="0.2" height="0.4" color="#e9c46a"></a-cone>
        <a-text value="Murhaf Baik - CPIS360" align="center" position="0 1.0 0" scale="0.7 0.7 0.7" color="#ffffff"></a-text>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
