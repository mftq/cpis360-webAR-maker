<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPIS360 - WebAR Lab</title>

    <!-- A-Frame library for building 3D and AR scenes -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- AR.js adds marker-based AR support on top of A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: black;
      }

      /* fix the video feed to fill the whole screen */
      #arjs-video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        z-index: -1;
      }

      /* fix the canvas to also fill the whole screen */
      canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
      }
    </style>
  </head>

  <body>

    <!--
      Using embedded mode with a-scene
      sourceType webcam for camera access
      detectionMode and matrixCodeType for reliable hiro marker detection
    -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; antialias: true;"
    >

      <!-- Hiro marker - point camera at the printed hiro marker -->
      <a-marker preset="hiro">

        <!--
          Shape 1 - Red rotating box in the center
          keeps rotating so the animation is clearly visible
        -->
        <a-box
          position="0 0.15 0"
          rotation="0 45 0"
          scale="0.2 0.2 0.2"
          color="#e63946"
        >
          <!-- spin the box around Y axis continuously -->
          <a-animation
            attribute="rotation"
            from="0 0 0"
            to="0 360 0"
            dur="2000"
            easing="linear"
            repeat="indefinite"
          ></a-animation>
        </a-box>

        <!--
          Shape 2 - Blue sphere on the left side
          bounces up and down so animation is very noticeable
        -->
        <a-sphere
          position="-0.3 0.1 0"
          radius="0.1"
          color="#457b9d"
        >
          <!-- bounce up and down repeatedly -->
          <a-animation
            attribute="position"
            from="-0.3 0.05 0"
            to="-0.3 0.25 0"
            dur="800"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-sphere>

        <!--
          Shape 3 - Green cylinder on the right side
          pulses in scale to show a different type of animation
        -->
        <a-cylinder
          position="0.3 0.15 0"
          radius="0.07"
          height="0.25"
          color="#2a9d8f"
        >
          <!-- grow and shrink repeatedly -->
          <a-animation
            attribute="scale"
            from="1 1 1"
            to="1 1.8 1"
            dur="900"
            direction="alternate"
            repeat="indefinite"
            easing="ease-in-out"
          ></a-animation>
        </a-cylinder>

        <!--
          Shape 4 - Yellow cone behind the box
          static shape for variety, meets the 3+ shapes requirement
        -->
        <a-cone
          position="0 0.1 -0.3"
          radius-bottom="0.1"
          height="0.2"
          color="#e9c46a"
        ></a-cone>

        <!--
          Student name displayed above all shapes
          white text so it shows up against any background
        -->
        <a-text
          value="Murhaf Baik - CPIS360"
          align="center"
          position="0 0.45 0"
          scale="0.35 0.35 0.35"
          color="#ffffff"
        ></a-text>

      </a-marker>

      <!-- camera entity needed for AR.js to access device camera -->
      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
